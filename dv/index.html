<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1F2840">
  <title>Davevite</title>
  <meta name="description" content="Tap your name to say if you're in.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Davevite">
  <meta property="og:description" content="Tap your name to say if you're in.">
  <meta property="og:url" content="https://www.nuttr.co/dv/">
  <meta property="og:image" content="https://www.nuttr.co/dv/share.jpg?v=2">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="600">
  <meta property="og:image:alt" content="Davevite">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <!-- Sends links in the nuttr.co/dv/?<code>&from=<name> form to the same invite on davevite.com. -->
  <script>
    const [code, ...rest] = location.search.slice(1).split('&');
    if (/^[a-z0-9][a-z0-9-]{3,79}$/i.test(code || '')) location.replace('https://davevite.com/' + code + (rest.length ? '?' + rest.join('&') : ''));
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #171D29; color: #FFF9EF; font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; }
    p { margin: 0 24px; opacity: 0.8; }
  </style>
</head>
<body>
  <p id="msg">Opening your invite…</p>
  <script>if (!/^[a-z0-9][a-z0-9-]{3,79}$/i.test(code || '')) document.getElementById('msg').textContent = 'Nothing here yet. I\'ll text you a link.';</script>
</body>
</html>
